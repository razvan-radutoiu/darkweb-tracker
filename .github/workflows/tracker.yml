name: DarkWeb Forums Tracker

"on":
  # schedule:
  #   - cron: '0 2 * * *'   # 每天北京时间 10:00（UTC+8）；配置好 Secrets 后取消注释
  workflow_dispatch:
    inputs:
      debug:
        description: '开启调试日志'
        type: boolean
        default: false
      skip_ai:
        description: '跳过 AI 分析（节省 API 配额）'
        type: boolean
        default: false
      skip_tor:
        description: '跳过 Tor（调试用，直连抓取）'
        type: boolean
        default: false

concurrency:
  group: darkweb-tracker
  cancel-in-progress: false

permissions:
  contents: write
  models: read
  pages: write
  id-token: write

jobs:
  track:
    name: 抓取 & 分析
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      has_changes: ${{ steps.commit.outputs.changes_detected }}
      report_date: ${{ steps.run.outputs.report_date }}
      has_reports: ${{ steps.check_reports.outputs.has_reports }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取最新数据
        run: |
          git pull --rebase origin main || echo "::warning::拉取失败，继续使用本地版本"

      - name: 安装并启动 Tor
        if: ${{ inputs.skip_tor != true }}
        run: |
          sudo apt-get install -y -q tor netcat-openbsd

          printf 'SocksPort 9050\nSocksPolicy accept 127.0.0.1\nLog notice stdout\nDataDirectory /var/lib/tor\nMaxCircuitDirtiness 600\nNewCircuitPeriod 30\nNumEntryGuards 3\n' | sudo tee /etc/tor/torrc > /dev/null

          sudo systemctl restart tor

          echo "⏳ 等待 Tor SOCKS5 端口就绪..."
          for i in $(seq 1 90); do
            if nc -z 127.0.0.1 9050 2>/dev/null; then
              echo "✅ Tor SOCKS5 端口已开放（${i}s）"
              break
            fi
            sleep 1
            if [ "$i" -eq 90 ]; then
              echo "::warning::Tor 未能在 90 秒内就绪，将尝试直连"
            fi
          done

          sleep 10

          TOR_IP=$(curl -s --max-time 30 --socks5-hostname 127.0.0.1:9050 https://api.ipify.org 2>/dev/null || echo "unknown")
          REAL_IP=$(curl -s --max-time 10 https://api.ipify.org 2>/dev/null || echo "unknown")
          echo "🧅 Tor 出口 IP : ${TOR_IP}"
          echo "📍 真实 IP     : ${REAL_IP}"
          if [ "$TOR_IP" != "$REAL_IP" ] && [ "$TOR_IP" != "unknown" ]; then
            echo "✅ Tor 匿名代理验证通过"
          else
            echo "::warning::Tor IP 未变化或无法连接"
            sudo systemctl status tor --no-pager || true
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          go build -ldflags="-s -w -X main.Version=${VERSION}" -o tracker ./cmd/tracker
          echo "Binary: $(./tracker --version)"

      - name: Run tracker
        id: run
        env:
          LLM_API_KEY:         ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK:     ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_TOKEN:      ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK:    ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET:     ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK:      ${{ secrets.FEISHU_WEBHOOK }}
          DISCORD_ENABLED:     ${{ secrets.DISCORD_WEBHOOK != '' && 'true' || 'false' }}
          TELEGRAM_ENABLED:    ${{ secrets.TELEGRAM_TOKEN != '' && 'true' || 'false' }}
          DINGTALK_ENABLED:    ${{ secrets.DINGTALK_WEBHOOK != '' && 'true' || 'false' }}
          FEISHU_ENABLED:      ${{ secrets.FEISHU_WEBHOOK != '' && 'true' || 'false' }}
          TOR_SOCKS:           ${{ inputs.skip_tor == true && '' || 'socks5://127.0.0.1:9050' }}
          NIGHT_SLEEP_ENABLED: "false"
          LLM_ENABLED:         ${{ inputs.skip_ai == true && 'false' || '' }}
        run: |
          echo "report_date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "report_time=$(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT
          ARGS="--once --config config.yaml --db data_leaks.db"
          if [ "${{ inputs.debug }}" = "true" ]; then ARGS="$ARGS --debug"; fi
          echo "::group::Tracker 运行日志"
          ./tracker $ARGS
          echo "::endgroup::"

      - name: 关闭 Tor
        if: ${{ always() && inputs.skip_tor != true }}
        run: sudo systemctl stop tor 2>/dev/null || true

      - name: Commit 结果
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: 扫描更新 ${{ steps.run.outputs.report_time }} [skip ci]"
          file_pattern: "data_leaks.db archive/** rss/** index.html"
          add_options: '--force'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          skip_dirty_check: false

      - name: 检查报告目录
        id: check_reports
        run: |
          if [ -d "archive" ] && [ "$(ls -A archive 2>/dev/null)" ]; then
            echo "has_reports=true" >> $GITHUB_OUTPUT
          else
            echo "has_reports=false" >> $GITHUB_OUTPUT
          fi

      - name: 准备 Pages 部署目录
        if: steps.check_reports.outputs.has_reports == 'true'
        run: |
          mkdir -p _site
          if [ -f "index.html" ]; then
            cp index.html _site/index.html
          else
            echo "<html><body><p>首次运行后报告将显示在此处</p></body></html>" > _site/index.html
          fi
          [ -d archive ] && cp -r archive _site/archive
          [ -d rss ]     && cp -r rss _site/rss

      - name: Upload Pages artifact
        if: steps.check_reports.outputs.has_reports == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy-pages:
    name: 部署报告到 GitHub Pages
    needs: track
    if: needs.track.outputs.has_reports == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  cleanup:
    name: 清理旧运行记录
    needs: track
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 14
          keep_minimum_runs: 10
