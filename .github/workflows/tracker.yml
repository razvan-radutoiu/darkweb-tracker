name: DarkWeb Forums Tracker

"on":
  schedule:
    - cron: '0 20 * * 5'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug logging'
        type: boolean
        default: false
      skip_ai:
        description: 'Skip AI analysis (save API quota)'
        type: boolean
        default: false
      skip_tor:
        description: 'Skip Tor (for debugging, connect directly)'
        type: boolean
        default: false

concurrency:
  group: darkweb-tracker
  cancel-in-progress: false

permissions:
  contents: write
  models: read

jobs:
  track:
    name: Scrape & Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      has_changes: ${{ steps.commit.outputs.changes_detected }}
      report_date: ${{ steps.run.outputs.report_date }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest data
        run: |
          git pull --rebase origin main || echo "::warning::Pull failed, continuing with local version"

      - name: Install and start Tor
        if: ${{ inputs.skip_tor != true }}
        run: |
          sudo apt-get install -y -q tor netcat-openbsd

          printf 'SocksPort 9050\nSocksPolicy accept 127.0.0.1\nLog notice stdout\nDataDirectory /var/lib/tor\nMaxCircuitDirtiness 600\nNewCircuitPeriod 30\nNumEntryGuards 3\n' | sudo tee /etc/tor/torrc > /dev/null

          sudo systemctl restart tor

          echo "⏳ Waiting for Tor SOCKS5 port to be ready..."
          for i in $(seq 1 90); do
            if nc -z 127.0.0.1 9050 2>/dev/null; then
              echo "✅ Tor SOCKS5 port is open (${i}s)"
              break
            fi
            sleep 1
            if [ "$i" -eq 90 ]; then
              echo "::warning::Tor did not become ready within 90 seconds, will try direct connection"
            fi
          done

          sleep 10

          TOR_IP=$(curl -s --max-time 30 --socks5-hostname 127.0.0.1:9050 https://api.ipify.org 2>/dev/null || echo "unknown")
          REAL_IP=$(curl -s --max-time 10 https://api.ipify.org 2>/dev/null || echo "unknown")
          echo "🧅 Tor exit IP : ${TOR_IP}"
          echo "📍 Real IP     : ${REAL_IP}"
          if [ "$TOR_IP" != "$REAL_IP" ] && [ "$TOR_IP" != "unknown" ]; then
            echo "✅ Tor anonymous proxy verified"
          else
            echo "::warning::Tor IP unchanged or unable to connect"
            sudo systemctl status tor --no-pager || true
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          go build -ldflags="-s -w -X main.Version=${VERSION}" -o tracker ./cmd/tracker
          echo "Binary: $(./tracker --version)"

      - name: Run tracker
        id: run
        env:
          LLM_API_KEY:         ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK:     ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_TOKEN:      ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK:    ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET:     ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK:      ${{ secrets.FEISHU_WEBHOOK }}
          DISCORD_ENABLED:     ${{ secrets.DISCORD_WEBHOOK != '' && 'true' || 'false' }}
          TELEGRAM_ENABLED:    ${{ secrets.TELEGRAM_TOKEN != '' && 'true' || 'false' }}
          DINGTALK_ENABLED:    ${{ secrets.DINGTALK_WEBHOOK != '' && 'true' || 'false' }}
          FEISHU_ENABLED:      ${{ secrets.FEISHU_WEBHOOK != '' && 'true' || 'false' }}
          TOR_SOCKS:           ${{ inputs.skip_tor == true && '' || 'socks5://127.0.0.1:9050' }}
          NIGHT_SLEEP_ENABLED: "false"
          LLM_ENABLED:         ${{ inputs.skip_ai == true && 'false' || '' }}
        run: |
          echo "report_date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "report_time=$(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT
          ARGS="--once --config config.yaml --db data_leaks.db"
          if [ "${{ inputs.debug }}" = "true" ]; then ARGS="$ARGS --debug"; fi
          echo "::group::Tracker run log"
          ./tracker $ARGS
          echo "::endgroup::"

      - name: Stop Tor
        if: ${{ always() && inputs.skip_tor != true }}
        run: sudo systemctl stop tor 2>/dev/null || true

      - name: Commit results
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: scan update ${{ steps.run.outputs.report_time }} [skip ci]"
          file_pattern: "data_leaks.db archive/** rss/** index.html"
          add_options: '--force'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          skip_dirty_check: false

  cleanup:
    name: Clean up old workflow runs
    needs: track
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 14
          keep_minimum_runs: 10
