# DarkWeb Forums Tracker — 配置文件
# 环境变量优先级高于此文件中的所有配置项
# workflow 只传 Secrets，所有业务配置在此统一管理

# ── RSS 源加载策略 ────────────────────────────────────────────────────────────
sources:
  # 自动从 fastfire/deepdarkCTI 解析 ONLINE 论坛，自动探测 RSS 端点
  # 每次启动拉取最新列表，发现新论坛自动纳入监控
  disable_auto_discover: false

  # 远程补充源（手动维护的额外列表，优先级最高）
  remote_url: ""

  # 健康检查：关闭
  # 原因：GitHub Actions runner 网络与论坛的连通性和实际用户不同，
  # 频繁误判导致漏掉有效源。自动发现阶段已做过一次探活。
  health_check: false

  # 保留内置 seed 兜底
  disable_builtin_seeds: false

# ── AI 分析：关闭 ────────────────────────────────────────────────────────────
# 直接输出原始报告，无 AI 评分
llm:
  enabled: false

# ── 推送渠道 ─────────────────────────────────────────────────────────────────
push:
  dingtalk:
    webhook: ""
    secret_key: ""
    enabled: false

  feishu:
    webhook: ""
    enabled: false

  telegram:
    token: ""
    chat_id: ""
    enabled: false

  discord:
    webhook: ""          # 由 workflow 通过 DISCORD_WEBHOOK secret 注入
    enabled: false       # 由 workflow 根据 secret 是否配置自动判断
    send_daily_report: false
    send_normal_msg: true
    send_weekly_report: true

# ── 代理 ─────────────────────────────────────────────────────────────────────
proxy:
  enabled: false
  http: ""
  https: ""
  no_proxy: "localhost,127.0.0.1"

# ── 夜间休眠（本地运行时生效，GitHub Actions 已按时区调度） ──────────────────
night_sleep:
  enabled: true
  start_hour: 0   # 北京时间 00:00
  end_hour: 7     # 北京时间 07:00

# ── 报告 ─────────────────────────────────────────────────────────────────────
daily_report:
  enabled: true   # 每次运行后生成当日 HTML 报告

weekly_report:
  enabled: true
  push_enabled: true
  push_time: "15:00"
  push_day: 5     # 5=周五

# ── 轮询间隔 ─────────────────────────────────────────────────────────────────
interval: "2h"

# ── 本地补充数据源（自动发现之外的额外源）────────────────────────────────────
# 自动发现已覆盖 deepdarkCTI 的所有 ONLINE 论坛，这里只需要填自动发现找不到的源
# 格式：name + rss_url + enabled
data_sources:
  # ransomware.live 和 ransomwatch 由代码内置，无需在此配置
  # 如需新增其他源，在此添加：
  # my_custom_source:
  #   name: "My Source"
  #   rss_url: "https://example.com/feed.rss"
  #   enabled: true
