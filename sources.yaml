# DarkWeb Forums Tracker — Community RSS Sources
# ─────────────────────────────────────────────
# 这是社区维护的 RSS 源列表。Fork 本项目后在此文件更新论坛地址，
# 其他用户只需设置 SOURCES_REMOTE_URL 指向你的 raw GitHub URL 即可自动同步。
#
# 格式说明：
#   name    : 展示名称（唯一标识，修改会视为新源）
#   rss_url : RSS/Atom feed 直链
#   enabled : true=启用 / false=暂时禁用（已迁移/暂时宕机时设 false）
#   tags    : 可选标签，用于将来的过滤功能
#   note    : 变更备注，记录迁移历史

