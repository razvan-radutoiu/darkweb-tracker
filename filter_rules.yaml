# ─────────────────────────────────────────────────────────────
# 规则引擎评分配置
# ─────────────────────────────────────────────────────────────
rules:

  # 供应商/垃圾帖模式：匹配任意一条 → 直接返回 score=2，不进入评分流程
  vendor_patterns:
    - "whatsapp:"
    - "whatsapp +"
    - "telegram @"
    - "telegram:"
    - "@telegram"
    - "buy fake"
    - "buy real and fake"
    - "buy diplomatic"
    - "buy passport"
    - "buy driver"
    - "buy id card"
    - "sell clone card"
    - "sell cc "
    - "sell cvv"
    - "combo mixed email"
    - "combo mixed mail"
    - "k++ combo"
    - "k++ ] combo"
    - "combo { "
    - "[ combo"
    - "fresh combo"
    - "free combo"
    - "hq combo"
    - "private combo"
    - "combo pack"
    - "mixed combo"

  # 一级论坛（评分 +1）
  tier1_sites:
    - breachforum
    - leakbase
    - thejavasea
    - exploit-in
    - xss-is

  # 二级论坛（仅分类标签，不加分）
  tier2_sites:
    - probiv
    - darkforum
    - altenens
    - nulled
    - leakforum
    - mipped
    - hard-tm
    - dublikat
    - leetforum
    - ipbmafia

  # 勒索软件相关站点（分类标签）
  ransom_sites:
    - ransomware
    - ransom
    - lockbit
    - alphv
    - blackcat

  # 新鲜度正向信号（评分 +1）
  fresh_positive:
    - fresh
    - "new"
    - latest
    - "2024"
    - "2025"
    - "2026"
    - today
    - just
    - hot
    - 0day

  # 新鲜度负向信号（评分 -2）
  fresh_negative:
    - old
    - "2020"
    - "2019"
    - "2018"
    - "2017"
    - "2016"
    - "2015"
    - "leaked in 20"
    - "from 20"

  # 数据类型关键词（命中 → 纳入类型列表，影响评分加成）
  # 注意：使用精确子串，避免误匹配（如 "pass" 会误匹配 "passport"）
  data_types:
    email:
      - "email"
      - "e-mail"
      - "@gmail"
      - "@yahoo"
      - "@hotmail"
      - "@outlook"
    password:
      - "password"
      - "passwd"
      - "pwd"
      - "hash"
      - "md5"
      - "sha1"
      - "bcrypt"
      - "ntlm"
      - "plaintext"
      - "cracked"
    phone:
      - "phone number"
      - "mobile number"
      - "telephone"
      - "gsm"
      - "sms code"
    address:
      - "home address"
      - "physical address"
      - "location data"
      - "zip code"
      - "postal code"
    credit_card:
      - "credit card"
      - "cc dump"
      - "cvv"
      - "cvc"
      - "fullz"
      - "card number"
      - "debit card"
    ssn:
      - "ssn"
      - "social security"
      - "national id number"
      - "tax id"
    dob:
      - "date of birth"
      - "birthday"
      - "birthdate"
      - "dob:"
    ip:
      - "ip address"
      - "ip log"
      - "ipv4"
      - "ipv6"
    cookie:
      - "cookie"
      - "session token"
      - "auth token"
      - "session cookie"
    source_code:
      - "source code"
      - "gitlab"
      - "repository leak"
      - "git dump"
    financial:
      - "bank account"
      - "iban"
      - "swift code"
      - "routing number"
      - "account balance"
      - "wire transfer"
    medical:
      - "medical record"
      - "health record"
      - "patient data"
      - "diagnosis"
      - "prescription"
      - "hipaa"
    government:
      - "government database"
      - ".gov"
      - "military data"
      - "dod "
      - "nsa "
      - "fbi "
      - "cia "
    # combo: 特殊标记，命中后评分上限为 4（聚合数据，非新鲜泄露）
    combo:
      - "combolist"
      - "combo list"
      - "mail:pass"
      - "email:pass"
      - "user:pass"
      - "login:pass"
